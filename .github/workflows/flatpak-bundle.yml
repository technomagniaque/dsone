name: Flatpak bundle

# Builds dsone-<arch>.flatpak from the tagged checkout and attaches it to the
# GitHub Release. Independent from Flathub: this is the "plan B" distribution
# channel described in flatpak/FLATHUB.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a specific commit for supply chain safety (same as flathub-update.yml)
  FLATPAK_BUILDER_TOOLS_COMMIT: ac5a296ac6111aa2319daf532f609a067b88d8a9

jobs:
  offline-sources:
    name: Generate offline cargo + pnpm sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Clone flatpak-builder-tools
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git
          cd flatpak-builder-tools
          git fetch --depth 1 origin "$FLATPAK_BUILDER_TOOLS_COMMIT"
          git checkout "$FLATPAK_BUILDER_TOOLS_COMMIT"

      - name: Generate cargo-sources.json
        run: |
          pip install tomlkit==0.14.0 aiohttp==3.13.3
          python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
            src-tauri/Cargo.lock -o flatpak/cargo-sources.json

      - name: Generate pnpm-sources.json
        run: |
          pip install ./flatpak-builder-tools/node
          flatpak-node-generator pnpm --pnpm-store-version v11 \
            pnpm-lock.yaml -o flatpak/pnpm-sources.json

      - name: Upload generated sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-offline-sources
          path: |
            flatpak/cargo-sources.json
            flatpak/pnpm-sources.json
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Build Flatpak (${{ matrix.arch }})
    needs: offline-sources
    permissions:
      contents: write # attach the bundle to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      # Must match runtime-version in the manifest (org.gnome.Platform 50).
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch generated sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-offline-sources
          path: flatpak

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: dsone-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.technomagniaque.dsone.local.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
          arch: ${{ matrix.arch }}
          # The action uploads the bundle as a workflow artifact by itself.
          upload-artifact: true

      - name: Attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dsone-${{ matrix.arch }}.flatpak
          fail_on_unmatched_files: true
