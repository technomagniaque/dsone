name: dsone
base: core24
adopt-info: build-app
title: dsone
summary: Native Linux client for Deezer and TIDAL
description: |
  Native Linux client for Deezer and TIDAL — lossless and bit-perfect audio streaming.
  dsone is a fork of SONE by lullabyX (https://github.com/technomagniaque/dsone).
  Supports HiRes FLAC, exclusive ALSA output, Scrobbling integration, MPRIS integration, and more.

  For exclusive ALSA output, run: sudo snap connect dsone:alsa
icon: snap/gui/sone.png
license: GPL-3.0-only
website: https://github.com/technomagniaque/dsone
source-code: https://github.com/technomagniaque/dsone
issues: https://github.com/technomagniaque/dsone/issues
contact: https://github.com/technomagniaque/dsone/issues

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

lint:
  ignore:
    - library:
        - usr/lib/x86_64-linux-gnu/libzvbi*
        - usr/lib/x86_64-linux-gnu/libEGL_mesa*
        - usr/lib/x86_64-linux-gnu/libGLESv2*
        - usr/lib/x86_64-linux-gnu/libGLX_mesa*
        - usr/lib/x86_64-linux-gnu/libIex*
        - usr/lib/x86_64-linux-gnu/libIlm*
        - usr/lib/x86_64-linux-gnu/libayatana*
        - usr/lib/x86_64-linux-gnu/libcaca*
        - usr/lib/x86_64-linux-gnu/libcolord*
        - usr/lib/x86_64-linux-gnu/libdconf*
        - usr/lib/x86_64-linux-gnu/libexslt*
        - usr/lib/x86_64-linux-gnu/libfaad*
        - usr/lib/x86_64-linux-gnu/libflite*
        - usr/lib/x86_64-linux-gnu/libgstcheck*
        - usr/lib/x86_64-linux-gnu/libgstcontroller*
        - usr/lib/x86_64-linux-gnu/libgstinsertbin*
        - usr/lib/x86_64-linux-gnu/libgstplayer*
        - usr/lib/x86_64-linux-gnu/libgsttranscoder*
        - usr/lib/x86_64-linux-gnu/libicu*
        - usr/lib/x86_64-linux-gnu/libjack*
        - usr/lib/x86_64-linux-gnu/libmfx*
        - usr/lib/x86_64-linux-gnu/liborc-test*
        - usr/lib/x86_64-linux-gnu/libsmime3*
        - usr/lib/x86_64-linux-gnu/libsphinx*
        - usr/lib/x86_64-linux-gnu/libssl3*
        - usr/lib/x86_64-linux-gnu/libunwind*
        - usr/lib/x86_64-linux-gnu/libwoff2enc*

layout:
  # Override the gnome extension's bind (it targets gnome-46-2404, which ships
  # no WebKit -> blank window). Key must match the extension's to replace it.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1
  /usr/lib/x86_64-linux-gnu/gstreamer-1.0:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0
  /usr/share/gstreamer-1.0:
    bind: $SNAP/usr/share/gstreamer-1.0
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/alsa-lib

slots:
  # mpris interface needs a dotless name; the app uses "dsone" under snap to match
  # (mpris.rs picks it via the SNAP env var). Grants org.mpris.MediaPlayer2.dsone.
  mpris:
    interface: mpris
    name: dsone

apps:
  dsone:
    command: usr/bin/dsone
    desktop: usr/share/applications/dsone.desktop
    extensions: [gnome]
    environment:
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    plugs:
      - home
      - network
      - network-bind
      - network-status
      - audio-playback
      - alsa
      - screen-inhibit-control

parts:
  build-app:
    plugin: dump
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - pkg-config
      - libssl-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libdbus-1-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libsecret-1-dev
      - libasound2-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libsecret-1-0
      - libasound2t64
      - libasound2-data
      - libasound2-plugins
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-alsa
      - libblas3
      - liblapack3
    source: .
    source-type: git
    override-build: |
      set -eu
      # rustup snap (core26) crashes if the gnome ext's LD_LIBRARY_PATH makes it
      # load the SDK's older libc; env -u wherever rustup/cargo/rustc run.
      env -u LD_LIBRARY_PATH rustup default stable

      VERSION=$(node -p "require('./package.json').version")
      craftctl set version="$VERSION"

      # pnpm project; install via npm (corepack isn't usable in the node snap).
      npm install -g pnpm@11.1.3
      export PATH="$(npm config get prefix)/bin:$PATH"
      pnpm install --frozen-lockfile
      # rm stale .deb so a version bump doesn't leave two for the glob below.
      rm -f src-tauri/target/release/bundle/deb/*.deb
      # no `--` before --bundles: pnpm would forward it to cargo, not tauri.
      env -u LD_LIBRARY_PATH pnpm tauri build --bundles deb
      dpkg -x src-tauri/target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/
      # libblas3/liblapack3 put their .so in blas//lapack/ subdirs; recreate the
      # update-alternatives symlinks so libgstlibav (ffmpeg) can load them.
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
      ln -sf blas/libblas.so.3 $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu/libblas.so.3
      ln -sf lapack/liblapack.so.3 $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu/liblapack.so.3
      # productName and mainBinaryName are both "dsone" (tauri.conf.json), so the
      # deb ships usr/bin/dsone, dsone.desktop and Icon=dsone.
      sed -i -e "s|Icon=dsone|Icon=/usr/share/icons/hicolor/32x32/apps/dsone.png|g" $SNAPCRAFT_PART_INSTALL/usr/share/applications/dsone.desktop
